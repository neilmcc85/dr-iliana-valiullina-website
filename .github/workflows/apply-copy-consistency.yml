name: Apply copy consistency

on:
  workflow_dispatch:
  push:
    branches: [fix/small-copy-consistency]
    paths:
      - 'scripts/apply-copy-consistency.sh'
      - '.github/workflows/apply-copy-consistency.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/small-copy-consistency
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fixes
        run: bash scripts/apply-copy-consistency.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/academic/index.html public/lessons/index.html public/language-lessons/index.html || true
          if git diff --staged --quiet; then
            echo "No HTML changes to commit"
          else
            git commit -m "fix: small copy consistency (twitter meta, CEUB completed, education not legal advice)"
            git push origin fix/small-copy-consistency
          fi
