name: Patch mobile polish

on:
  workflow_dispatch:
  push:
    branches: [fix/mobile-polish]
    paths:
      - 'scripts/patch-mobile-polish.sh'
      - '.github/workflows/patch-mobile-polish.yml'
      - 'public/js/language-switcher.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-polish
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply mobile polish
        run: bash scripts/patch-mobile-polish.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: mobile polish — tap language menu, icon hamburger on money pages"
            git push origin fix/mobile-polish
          fi
