name: Patch nav name CTA

on:
  workflow_dispatch:
  push:
    branches: [fix/nav-name-cta-spacing]
    paths:
      - 'scripts/patch-nav-name-cta.sh'
      - '.github/workflows/patch-nav-name-cta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-name-cta-spacing
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply CSS patch and rebuild
        run: bash scripts/patch-nav-name-cta.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/input.css public/css/site.css
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: keep nav name and consultation CTA on one line"
            git push origin fix/nav-name-cta-spacing
          fi
